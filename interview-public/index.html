<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="منصة عربية للتدريب على مقابلات العمل حسب التخصص، مع أسئلة صوتية وتقييم للإجابات وتقرير نهائي.">
  <title>محاكي مقابلات العمل الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى الرئيسي</a>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#home" class="brand" aria-label="محاكي مقابلات العمل الذكي — الصفحة الرئيسية">
        <span class="brand-mark" aria-hidden="true">م</span>
        <span class="brand-text"><strong>محاكي مقابلات العمل</strong><small>الذكي</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNav">
        <span aria-hidden="true">☰</span> القائمة
      </button>
      <nav id="mainNav" class="main-nav" aria-label="التنقل الرئيسي">
        <a href="#home" data-nav="home">الأقسام</a>
        <a href="#interview" data-nav="interview">المقابلة</a>
        <a href="#report" data-nav="report">التقرير</a>
      </nav>
    </div>
  </header>

  <nav id="stepper" class="stepper" aria-label="مراحل إعداد المقابلة" hidden></nav>

  <main id="main" class="container" tabindex="-1">
    <section id="view-home" class="view" hidden></section>
    <section id="view-field" class="view" hidden></section>
    <section id="view-details" class="view" hidden></section>
    <section id="view-files" class="view" hidden></section>
    <section id="view-setup" class="view" hidden></section>
    <section id="view-interview" class="view" hidden></section>
    <section id="view-report" class="view" hidden></section>
    <noscript><p class="alert alert-error">تحتاج المنصة إلى تفعيل JavaScript في المتصفح.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>محاكي مقابلات العمل الذكي — أداة تدريبية. التقييمات إرشادية ولا تضمن نتيجة أي مقابلة فعلية.</p>
    </div>
  </footer>

  <div id="loading" class="loading-overlay" hidden role="status" aria-live="assertive">
    <div class="loading-box"><span class="spinner" aria-hidden="true"></span><p id="loadingText">جارٍ التحميل…</p></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button type="button" class="icon-btn" id="modalClose" aria-label="إغلاق">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/file-reader.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/planning-bank.js"></script>
  <script src="js/planning-bank-ar.js"></script>
  <script src="js/planning-bank-answers-ar.js"></script>
  <script src="js/published-bank.js"></script>
  <script src="js/admin-store.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
